name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 既知の脆弱性を含む依存のままデプロイされないようにする。
      # 本番に載る依存だけを見る（開発ツールの検知でCIを止めない）。
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:guide
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build
